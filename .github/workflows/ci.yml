name: CI

# Quality + security gate. Make these required status checks on `main`
# (Settings → Branches → Branch protection) so nothing reaches the Vercel
# auto-deploy without passing: lint, type-check, the production build, and a
# production-dependency audit.

# Pull requests only. A merge to main is the PR's own tested head (squash
# merges), so running again on push doubled the Actions minutes for nothing;
# Vercel still builds main on every merge. Drafts skip until they are marked
# ready, so a draft pushed ten times runs once.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # The app and its package.json live in app/, not the repo root.
    working-directory: app

jobs:
  build:
    name: lint + type-check + build
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install (lockfile-pinned)
        id: install
        run: pnpm install --frozen-lockfile

      # A full lint fits in 3 GB once the React Compiler rules skip useClozr.ts
      # (see eslint.config.mjs); with them on, that one file ran past 6 GB.
      # 4 GB leaves headroom over Node's ~2 GB default without starving the
      # 7 GB runner.
      - name: Lint
        run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Run even when Lint fails, so a lint crash never hides a type error or a
      # broken build. The job still fails if any step does.
      - name: Type-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Build (static export)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

  audit:
    name: production dependency audit
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install (lockfile-pinned)
        run: pnpm install --frozen-lockfile

      # Fail on a HIGH/CRITICAL advisory in the PRODUCTION tree only. The
      # browser bundle is what ships; build tooling advisories are tracked but
      # must not block a fix from going out.
      - name: Audit (production deps)
        run: pnpm audit --prod --audit-level=high
