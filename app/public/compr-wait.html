<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMPR · underwriting</title>
<!-- Shown in the COMPR window while CLOZR underwrites a house COMPR has never
     run (lib/compr-window.ts). CLOZR navigates this window to the report the
     moment the run lands, so this page only has to say what is happening. -->
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #fafafa; color: #18181b;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  .card { width: min(440px, 100%); background: #fff; border: 1px solid #e4e4e7; border-radius: 14px; padding: 24px; box-sizing: border-box; }
  .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #0A8560; font-weight: 700; }
  h1 { margin: 6px 0 4px; font-size: 18px; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  p { margin: 0; color: #52525b; }
  .bar { margin-top: 16px; height: 4px; border-radius: 4px; background: #eef2f7; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 30%; background: #0A8560; border-radius: 4px; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
  .time { margin-top: 10px; font-size: 12px; color: #a1a1aa; }
  .err { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: #fef2f2; color: #b91c1c; font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="eyebrow">COMPR underwriting</div>
    <h1 id="addr">This house</h1>
    <p id="what">COMPR is running it now. The report opens in this window when it lands, usually within a minute.</p>
    <div class="bar" id="bar"><i></i></div>
    <div class="time" id="time"></div>
    <div class="err" id="err" hidden></div>
  </div>
</main>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var addr = q.get('addr') || '';
    var photos = Number(q.get('photos') || 0);
    var error = q.get('error');
    if (addr) document.getElementById('addr').textContent = addr;
    document.title = 'COMPR · ' + (addr || 'underwriting');
    if (photos > 0) {
      document.getElementById('what').textContent = 'COMPR is running it now with the ' + photos + ' photo' + (photos === 1 ? '' : 's')
        + ' on the record. The report opens in this window when it lands, usually within a minute.';
    }
    if (error) {
      document.getElementById('bar').hidden = true;
      document.getElementById('what').textContent = 'COMPR could not finish this one.';
      var e = document.getElementById('err');
      e.textContent = error + ' Press Open in COMPR on the record to try again.';
      e.hidden = false;
      return;
    }
    var start = Date.now();
    var t = document.getElementById('time');
    setInterval(function () {
      var secs = Math.round((Date.now() - start) / 1000);
      t.textContent = secs + 's' + (secs > 180 ? ' · taking long: press Open in COMPR on the record again' : '');
    }, 1000);
    // Ask the CLOZR tab that opened this window whether the run landed. The
    // tab that started it moves this window on when the run ends; one that
    // reloaded meanwhile no longer can, so it answers this instead.
    var deal = q.get('deal');
    if (deal && window.opener) {
      setInterval(function () {
        try { window.opener.postMessage({ source: 'clozr-wait', type: 'waiting', dealId: deal }, location.origin); } catch (e) {}
      }, 4000);
    }
  })();
</script>
</body>
</html>
